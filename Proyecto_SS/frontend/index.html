<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300..800&display=swap" rel="stylesheet">
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<main class="login">
    <section class="login__content">
        <h1 class="login__title">Inicia Sesión</h1>
        <form class="form-register" id="loginForm">
            <div class="form__field">
                <label class="login__label" for="correo_institucional">Correo Electrónico:</label>
                <input class="form__input" type="email" id="correo_institucional" placeholder="Ingrese su correo institucional" required>
            </div>
            <div class="form__field">
                <label class="login__label" for="password">Contraseña:</label>
                <input class="form__input" type="password" id="password" placeholder="*******" required>
            </div>
            <button class="form__button" type="submit">Iniciar Sesión</button>
        </form>

        <nav class="login__nav">
            <a class="login__link" href="/ayuda">¿Necesitas ayuda? Comunícate con nosotros</a>
            <a class="login__link" href="/forgot">¿Olvidaste tu contraseña? <span>Restablecer</span></a>
        </nav>
    </section>
</main>

<script src="js/login.js"></script>
</body>
</html>
